# 示例rclone配置文件
# 实际使用时，请替换下面的占位符为您的真实信息

# AWS S3 配置示例
[aws-s3]
type = s3
provider = AWS
access_key_id = YOUR_AWS_ACCESS_KEY_ID
secret_access_key = YOUR_AWS_SECRET_ACCESS_KEY
region = us-east-1
acl = private
bucket_acl = private

# 阿里云OSS配置示例
[aliyun-oss]
type = s3
provider = Alibaba
access_key_id = YOUR_ALIYUN_ACCESS_KEY_ID
secret_access_key = YOUR_ALIYUN_ACCESS_KEY_SECRET
endpoint = oss-cn-beijing.aliyuncs.com
acl = private
bucket_acl = private
force_path_style = false

# 腾讯云COS配置示例
[tencent-cos]
type = s3
provider = TencentCOS
env_auth = false
access_key_id = YOUR_TENCENT_SECRET_ID
secret_access_key = YOUR_TENCENT_SECRET_KEY
endpoint = cos.ap-beijing.myqcloud.com
acl = private
bucket_acl = private
force_path_style = false

# Cloudflare R2 配置示例
[cloudflare-r2]
type = s3
provider = Cloudflare
access_key_id = YOUR_R2_ACCESS_KEY_ID
secret_access_key = YOUR_R2_SECRET_ACCESS_KEY
endpoint = https://YOUR_ACCOUNT_ID.r2.cloudflarestorage.com
acl = private
bucket_acl = private
no_check_bucket = true

# Backblaze B2 配置示例
[backblaze-b2]
type = b2
account = YOUR_B2_ACCOUNT_ID
key = YOUR_B2_APPLICATION_KEY 